# phpMyAdmin nginx proxy configuration for Vesta Control Panel
# Listens on port 8084 with SSL

server {
    listen 8084 ssl;
    http2 on;
    server_name _;

    ssl_certificate /usr/local/vesta/ssl/certificate.crt;
    ssl_certificate_key /usr/local/vesta/ssl/certificate.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:8080/phpmyadmin/;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 8084;
        proxy_cookie_path /phpmyadmin /;
        proxy_redirect http://127.0.0.1:8080/phpmyadmin/ /;
    }
}
