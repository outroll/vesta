dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

protocols = imap pop3
listen = *
base_dir = /var/run/dovecot/
log_path = /var/log/maillog

mail_driver = maildir
mail_path = %{home}/mail/%{user | domain}/%{user | username}
mail_privileged_group = mail
mail_access_groups = mail

auth_allow_cleartext = yes
auth_mechanisms = plain login
auth_verbose = yes

# Vesta writes one passwd-file per domain at
# $HOMEDIR/$user/conf/mail/$domain/passwd, symlinked into place by
# bin/v-add-mail-domain at /etc/$MAIL_SYSTEM/domains/$domain -- since
# MAIL_SYSTEM is 'exim' here (matching Alpine's exim package/init-script
# name), that's /etc/exim/domains/$domain/passwd.
passdb passwdfile {
  driver = passwd-file
  passwd_file_path = /etc/exim/domains/%{user | domain}/passwd
  default_password_scheme = MD5-CRYPT
}

userdb passwdfile {
  driver = passwd-file
  passwd_file_path = /etc/exim/domains/%{user | domain}/passwd
}

ssl = yes
ssl_server_cert_file = /usr/local/vesta/ssl/certificate.crt
ssl_server_key_file = /usr/local/vesta/ssl/certificate.key

service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

service pop3-login {
  inet_listener pop3 {
    port = 110
  }
  inet_listener pop3s {
    port = 995
    ssl = yes
  }
}

# Exim's SMTP AUTH (dovecot_plain/dovecot_login authenticators) connects to
# this socket -- see install/alpine/3.24/exim/exim.conf.
service auth {
  unix_listener auth-client {
    group = mail
    mode = 0660
    user = dovecot
  }
  user = dovecot
}
