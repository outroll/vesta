[vesta]
listen = /run/vesta-php.sock
listen.owner = admin
listen.group = admin

user = admin
group = admin

; The panel's PHP code shells out to `sudo $VESTA/bin/v-*` (see
; web/inc/main.php's VESTA_CMD) for basically everything, including login.
; Those scripts source $VESTA/func/main.sh themselves, so $VESTA has to be
; in the environment sudo is invoked from -- php-fpm is a daemon, not a
; login shell, so it never picks up /etc/profile.d/vesta.sh on its own.
env[VESTA] = /usr/local/vesta

pm = ondemand
pm.max_children = 4
pm.max_requests = 4000
pm.process_idle_timeout = 10s
