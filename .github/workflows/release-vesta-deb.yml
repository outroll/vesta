name: Release vesta .deb

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build vesta_amd64.deb
        run: src/deb/build.sh "${GITHUB_REF_NAME#v}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" vesta_amd64.deb --clobber
          else
            gh release create "$GITHUB_REF_NAME" vesta_amd64.deb --title "$GITHUB_REF_NAME" --generate-notes
          fi
