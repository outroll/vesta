name: Release vesta .deb

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build vesta_amd64.deb
        run: src/deb/build.sh "${GITHUB_REF_NAME#v}"

      - name: Install nginx/php build dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential libpcre3-dev zlib1g-dev \
            libssl-dev libxml2-dev libcurl4-openssl-dev libonig-dev \
            libzip-dev libsqlite3-dev pkg-config bison re2c autoconf

      - name: Build vesta-ioncube_amd64.deb
        run: src/deb/ioncube/build.sh "${GITHUB_REF_NAME#v}"

      - name: Build vesta-nginx_amd64.deb
        run: src/deb/nginx/build.sh "${GITHUB_REF_NAME#v}"

      - name: Build vesta-php_amd64.deb
        run: src/deb/php/build.sh "${GITHUB_REF_NAME#v}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets="vesta_amd64.deb vesta-ioncube_amd64.deb vesta-nginx_amd64.deb vesta-php_amd64.deb"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $assets --clobber
          else
            gh release create "$GITHUB_REF_NAME" $assets --title "$GITHUB_REF_NAME" --generate-notes
          fi
