name: Build Vesta Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g., 2.0.0)'
        required: true
        default: '2.0.0'

jobs:
  build-deb:
    name: Build Debian Packages
    runs-on: ubuntu-latest

    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        include:
          - os: ubuntu-22.04
            codename: jammy
          - os: ubuntu-24.04
            codename: noble

    steps:
    - uses: actions/checkout@v4

    - name: Set version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        else
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
        fi

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y dpkg-dev fakeroot

    - name: Build vesta package
      run: |
        cd src/deb/vesta

        # Update version and architecture
        sed -i "s/Version:.*/Version: ${{ steps.version.outputs.VERSION }}/" control
        sed -i "s/Architecture:.*/Architecture: all/" control

        # Create package structure
        mkdir -p pkg/DEBIAN
        mkdir -p pkg/usr/local/vesta

        # Copy control files
        cp control pkg/DEBIAN/
        cp postinst pkg/DEBIAN/ 2>/dev/null || true
        cp conffiles pkg/DEBIAN/ 2>/dev/null || true
        chmod 755 pkg/DEBIAN/postinst 2>/dev/null || true

        # Copy vesta files
        cp -r ../../../bin pkg/usr/local/vesta/ 2>/dev/null || true
        cp -r ../../../web pkg/usr/local/vesta/ 2>/dev/null || true
        cp -r ../../../func pkg/usr/local/vesta/ 2>/dev/null || true
        cp -r ../../../data pkg/usr/local/vesta/ 2>/dev/null || true

        # Build package
        fakeroot dpkg-deb --build pkg vesta_${{ steps.version.outputs.VERSION }}_all.deb

        mv *.deb ../../../

    - name: Build vesta-nginx package
      run: |
        cd src/deb/nginx

        sed -i "s/Version:.*/Version: ${{ steps.version.outputs.VERSION }}/" control
        sed -i "s/Architecture:.*/Architecture: all/" control

        mkdir -p pkg/DEBIAN
        cp control pkg/DEBIAN/
        cp postinst pkg/DEBIAN/ 2>/dev/null || true
        chmod 755 pkg/DEBIAN/postinst 2>/dev/null || true

        # Copy nginx configs
        mkdir -p pkg/usr/local/vesta/nginx
        cp -r ../../../install/${{ matrix.codename }}/nginx/* pkg/usr/local/vesta/nginx/ 2>/dev/null || \
        cp -r ../../../install/ubuntu/22.04/nginx/* pkg/usr/local/vesta/nginx/ 2>/dev/null || true

        fakeroot dpkg-deb --build pkg vesta-nginx_${{ steps.version.outputs.VERSION }}_all.deb

        mv *.deb ../../../

    - name: Build vesta-php package
      run: |
        cd src/deb/php

        sed -i "s/Version:.*/Version: ${{ steps.version.outputs.VERSION }}/" control
        sed -i "s/Architecture:.*/Architecture: all/" control

        mkdir -p pkg/DEBIAN
        cp control pkg/DEBIAN/
        cp postinst pkg/DEBIAN/ 2>/dev/null || true
        chmod 755 pkg/DEBIAN/postinst 2>/dev/null || true

        mkdir -p pkg/usr/local/vesta/php

        fakeroot dpkg-deb --build pkg vesta-php_${{ steps.version.outputs.VERSION }}_all.deb

        mv *.deb ../../../

    - name: List built packages
      run: |
        ls -la *.deb

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: vesta-packages-${{ matrix.codename }}
        path: "*.deb"
        retention-days: 30

  create-release:
    name: Create Release
    needs: build-deb
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: packages

    - name: List packages
      run: find packages -name "*.deb" -ls

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: packages/**/*.deb
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-apt-repo:
    name: Update APT Repository
    needs: build-deb
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
    - uses: actions/checkout@v4
      with:
        ref: apt-repo
        fetch-depth: 0

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: packages

    - name: Setup APT repository structure
      run: |
        mkdir -p pool/main
        mkdir -p dists/jammy/main/binary-amd64
        mkdir -p dists/jammy/main/binary-arm64
        mkdir -p dists/noble/main/binary-amd64
        mkdir -p dists/noble/main/binary-arm64

        # Copy packages
        find packages -name "*.deb" -exec cp {} pool/main/ \;

        # Generate Packages files
        cd pool/main
        dpkg-scanpackages . /dev/null > ../../dists/jammy/main/binary-amd64/Packages
        dpkg-scanpackages . /dev/null > ../../dists/noble/main/binary-amd64/Packages
        gzip -k ../../dists/jammy/main/binary-amd64/Packages
        gzip -k ../../dists/noble/main/binary-amd64/Packages

    - name: Commit and push
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add -A
        git commit -m "Update packages for ${GITHUB_REF#refs/tags/}" || true
        git push
