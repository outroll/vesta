name: Build Vesta Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g., 2.0.0)'
        required: true
        default: '2.0.0'

jobs:
  build-deb:
    name: Build Debian Packages
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        else
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
        fi

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y dpkg-dev fakeroot

    - name: Build vesta package
      run: |
        cd src/deb/vesta

        # Update version and architecture
        sed -i "s/Version:.*/Version: ${{ steps.version.outputs.VERSION }}/" control
        sed -i "s/Architecture:.*/Architecture: all/" control

        # Create package structure
        mkdir -p pkg/DEBIAN
        mkdir -p pkg/usr/local/vesta

        # Copy control files
        cp control pkg/DEBIAN/
        cp postinst pkg/DEBIAN/ 2>/dev/null || true
        cp conffiles pkg/DEBIAN/ 2>/dev/null || true
        chmod 755 pkg/DEBIAN/postinst 2>/dev/null || true

        # Copy vesta files
        cp -r ../../../bin pkg/usr/local/vesta/ 2>/dev/null || true
        cp -r ../../../web pkg/usr/local/vesta/ 2>/dev/null || true
        cp -r ../../../func pkg/usr/local/vesta/ 2>/dev/null || true
        cp -r ../../../data pkg/usr/local/vesta/ 2>/dev/null || true

        # Build package
        fakeroot dpkg-deb --build pkg vesta_${{ steps.version.outputs.VERSION }}_all.deb

        mv *.deb ../../../

    - name: Build vesta-nginx package
      run: |
        cd src/deb/nginx

        sed -i "s/Version:.*/Version: ${{ steps.version.outputs.VERSION }}/" control
        sed -i "s/Architecture:.*/Architecture: all/" control

        mkdir -p pkg/DEBIAN
        cp control pkg/DEBIAN/
        cp postinst pkg/DEBIAN/ 2>/dev/null || true
        chmod 755 pkg/DEBIAN/postinst 2>/dev/null || true

        # Copy nginx configs (use install/ubuntu as fallback)
        mkdir -p pkg/usr/local/vesta/nginx
        cp -r ../../../install/ubuntu/22.04/nginx/* pkg/usr/local/vesta/nginx/ 2>/dev/null || true

        fakeroot dpkg-deb --build pkg vesta-nginx_${{ steps.version.outputs.VERSION }}_all.deb

        mv *.deb ../../../

    - name: Build vesta-php package
      run: |
        cd src/deb/php

        sed -i "s/Version:.*/Version: ${{ steps.version.outputs.VERSION }}/" control
        sed -i "s/Architecture:.*/Architecture: all/" control

        mkdir -p pkg/DEBIAN
        cp control pkg/DEBIAN/
        cp postinst pkg/DEBIAN/ 2>/dev/null || true
        chmod 755 pkg/DEBIAN/postinst 2>/dev/null || true

        mkdir -p pkg/usr/local/vesta/php

        fakeroot dpkg-deb --build pkg vesta-php_${{ steps.version.outputs.VERSION }}_all.deb

        mv *.deb ../../../

    - name: List built packages
      run: |
        ls -la *.deb

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: vesta-packages
        path: "*.deb"
        retention-days: 30

  create-release:
    name: Create Release
    needs: build-deb
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: vesta-packages
        path: packages

    - name: List packages
      run: ls -la packages/

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: packages/*.deb
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
